# .github/workflows/ci.yml
name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    DOTNET_VERSION: "8.0.x"

jobs:
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: FitTrackProTestDb
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 3s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Shallow clones disabled for SonarCloud

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Cache NuGet packages
              uses: actions/cache@v3
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore

            - name: Build solution
              run: dotnet build --no-restore --configuration Release

            - name: Run unit tests
              run: |
                  dotnet test tests/FitTrackPro.Domain.Tests \
                    --no-build \
                    --configuration Release \
                    --logger "trx;LogFileName=domain-test-results.trx" \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage

            - name: Run application tests
              run: |
                  dotnet test tests/FitTrackPro.Application.Tests \
                    --no-build \
                    --configuration Release \
                    --logger "trx;LogFileName=application-test-results.trx" \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage

            - name: Run integration tests
              env:
                  ConnectionStrings__DefaultConnection: "Host=localhost;Database=FitTrackProTestDb;Username=test_user;Password=test_password"
                  ConnectionStrings__Redis: "localhost:6379"
              run: |
                  dotnet test tests/FitTrackPro.API.IntegrationTests \
                    --no-build \
                    --configuration Release \
                    --logger "trx;LogFileName=integration-test-results.trx" \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage

            - name: Merge coverage reports
              run: |
                  dotnet tool install -g dotnet-reportgenerator-globaltool
                  reportgenerator \
                    -reports:"coverage/**/coverage.cobertura.xml" \
                    -targetdir:"coverage/merged" \
                    -reporttypes:"Cobertura;HtmlInline_AzurePipelines"

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  files: ./coverage/merged/Cobertura.xml
                  flags: unittests
                  name: codecov-fittrackpro
                  fail_ci_if_error: false

            - name: Publish test results
              uses: dorny/test-reporter@v1
              if: always()
              with:
                  name: Test Results
                  path: "**/*.trx"
                  reporter: dotnet-trx

            - name: Check code coverage threshold
              run: |
                  COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/merged/Cobertura.xml | head -1)
                  COVERAGE_PERCENT=$(echo "$COVERAGE * 100" | bc)
                  echo "Code coverage: $COVERAGE_PERCENT%"
                  if (( $(echo "$COVERAGE_PERCENT < 80" | bc -l) )); then
                    echo "❌ Code coverage is below 80%"
                    exit 1
                  fi
                  echo "✅ Code coverage is above 80%"

    code-quality:
        name: Code Quality Analysis
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Run code analysis
              run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

            - name: Install dotnet-format
              run: dotnet tool install -g dotnet-format

            - name: Check code formatting
              run: dotnet format --verify-no-changes --verbosity diagnostic

    docker-build:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: [build-and-test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./src/FitTrackPro.API/Dockerfile
                  push: false
                  tags: fittrackpro-api:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Test Docker image
              run: |
                  docker run --rm -d -p 5000:80 --name test-container fittrackpro-api:${{ github.sha }}
                  sleep 10
                  curl -f http://localhost:5000/health || exit 1
                  docker stop test-container

    security-scan:
        name: Security Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-results.sarif"

            - name: Upload Trivy results to GitHub Security
              uses: github/codeql-action/upload-sarif@v2
              with:
                  sarif_file: "trivy-results.sarif"
