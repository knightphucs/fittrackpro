# .github/workflows/cd.yml
name: CD

on:
    push:
        branches: [main]
        tags:
            - "v*"

env:
    DOTNET_VERSION: "8.0.x"
    AZURE_WEBAPP_NAME: fittrackpro-api

jobs:
    deploy-staging:
        name: Deploy to Staging
        runs-on: ubuntu-latest
        environment:
            name: staging
            url: https://staging.fittrackpro.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Publish
              run: dotnet publish src/FitTrackPro.API/FitTrackPro.API.csproj -c Release -o ./publish

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v2
              with:
                  app-name: ${{ env.AZURE_WEBAPP_NAME }}-staging
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
                  package: ./publish

            - name: Run smoke tests
              run: |
                  sleep 30
                  curl -f https://staging.fittrackpro.com/health || exit 1
                  echo "✅ Staging deployment successful"

    deploy-production:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: [deploy-staging]
        environment:
            name: production
            url: https://fittrackpro.com
        if: startsWith(github.ref, 'refs/tags/v')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Publish
              run: dotnet publish src/FitTrackPro.API/FitTrackPro.API.csproj -c Release -o ./publish

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v2
              with:
                  app-name: ${{ env.AZURE_WEBAPP_NAME }}
                  publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
                  package: ./publish

            - name: Run smoke tests
              run: |
                  sleep 30
                  curl -f https://fittrackpro.com/health || exit 1
                  echo "✅ Production deployment successful"

            - name: Create GitHub Release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref }}
                  draft: false
                  prerelease: false
