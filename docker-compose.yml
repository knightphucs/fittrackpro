services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fittrackpro-postgres
    restart: always
    environment:
      POSTGRES_DB: FitTrackProDb
      POSTGRES_USER: fittrack_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ENV}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fittrackpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack_user -d FitTrackProDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fittrackpro-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fittrackpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: fittrackpro-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - fittrackpro-network
    depends_on:
      - redis

  # Seq Logging
  seq:
    image: datalust/seq:latest
    container_name: fittrackpro-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_PASSWORD_ENV}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - fittrackpro-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fittrackpro-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - fittrackpro-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana (Elasticsearch Dashboard)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: fittrackpro-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - fittrackpro-network
    depends_on:
      - elasticsearch

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fittrackpro-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fittrackpro.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD_ENV}
    ports:
      - "5050:80"
    networks:
      - fittrackpro-network
    depends_on:
      - postgres

  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: fittrackpro-mongo
    restart: always
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_DATABASE: FitTrackPro_NoSql
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD_ENV}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fittrackpro-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Mongo Express (MongoDB Admin Interface)
  mongo-express:
    image: mongo-express:latest
    container_name: fittrackpro-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD_ENV}
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_PASSWORD_ENV}@mongo:27017/
    networks:
      - fittrackpro-network
    depends_on:
      - mongo

  # MailHog (Email Testing Tool)
  mailhog:
    image: mailhog/mailhog
    container_name: fittrackpro-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - fittrackpro-network

  # API Application
  api:
    build:
      context: .
      dockerfile: src/FitTrackPro.API/Dockerfile
    container_name: fittrackpro-api
    restart: always
    volumes:
      - ./uploads:/app/uploads
      - ./ml-models:/app/MLModels
      # Keep training dataset outside repo to avoid bloating git history.
      # Override TRAINING_DATA_HOST_PATH in your shell/.env when needed.
      - ${TRAINING_DATA_HOST_PATH:-../fittrackpro-data/training-data}:/app/scripts/training-data:ro
      - ./scripts/mlnet-resources:/tmp/MLNET
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80

      - ConnectionStrings__DefaultConnection=Host=fittrackpro-postgres;Port=5432;Database=FitTrackProDb;Username=fittrack_user;Password=${POSTGRES_PASSWORD_ENV}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Elasticsearch=http://elasticsearch:9200
      - ConnectionStrings__MongoDbConnection=mongodb://root:${MONGO_PASSWORD_ENV}@fittrackpro-mongo:27017/?authSource=admin

      - MongoDbSettings__DatabaseName=FitTrackPro_NoSql

      - Elasticsearch__Uri=http://elasticsearch:9200

      - Serilog__WriteTo__1__Args__serverUrl=http://seq:80

      - Jwt__Secret=${JWT_SECRET_ENV}
      - Jwt__Issuer=FitTrackPro
      - Jwt__Audience=FitTrackProUsers

      - FileStorage__Provider=${FILE_STORAGE_PROVIDER_ENV}
      - FileStorage__LocalPath=/app/uploads
      - FoodRecognition__ModelPath=/app/MLModels/food_recognition_model.zip
      - FoodRecognition__TrainingDataPath=/app/scripts/training-data
      - MICROSOFTML_RESOURCE_PATH=/tmp/MLNET

      - CloudinarySettings__CloudName=${CLOUDINARY_CLOUD_NAME_ENV}
      - CloudinarySettings__ApiKey=${CLOUDINARY_API_KEY_ENV}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_API_SECRET_ENV}

      - EmailSettings__SmtpServer=${EMAIL_SMTP_SERVER}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__SenderName=${EMAIL_SENDER_NAME}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - EmailSettings__Username=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - fittrackpro-network

volumes:
  postgres_data:
  redis_data:
  seq_data:
  elasticsearch_data:
  mongo_data:

networks:
  fittrackpro-network:
    driver: bridge
